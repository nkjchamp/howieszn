kground:#fff;border:1px solid #cbd4c8;border-radius:9px;min-height:44px;padding:10px 12px;color:var(--ink)}input[type=checkbox]{accent-color:var(--green);width:18px;height:18px;flex-shrink:0}input.short{max-width:100px}.segmented{display:flex;gap:8px}.segment{flex:1;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff}.segment[aria-pressed=true]{background:#eaf2df;border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);font-weight:700}.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid #edf0e9}.row:last-child{border:0}.row select{width:auto;min-width:68px}.row p{font-size:12px;color:var(--muted);margin:3px 0 0}.choice{display:flex;gap:12px;padding:15px;border:1px solid var(--line);border-radius:11px;align-items:flex-start;margin:10px 0;cursor:pointer}.choice:has(input:checked){border-color:var(--green);background:#f3f7ee}.choice input{margin:3px 0;accent-color:var(--green);flex-shrink:0}.choice b{font-size:14px;display:block}.choice small{display:block;font-size:12px;color:var(--muted);margin-top:3px}.names{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.names label{font-size:12px;color:var(--muted)}.names input{margin-top:5px}.avatars{display:flex;gap:6px;margin-top:18px}.avatar{width:29px;height:29px;background:#d6e1ce;display:grid;place-items:center;border-radius:50%;font-size:11px;font-weight:700}.quiet-button{border:0;background:none;color:var(--green);font-size:12px;text-decoration:underline;padding:6px 0}.callout{background:#f1f5eb;border-radius:10px;padding:14px;font-size:13px;color:#415640;margin-top:16px}.warning{background:#fbf3df;color:#6c552a}.muted{color:var(--muted)}details{border-top:1px solid var(--line);padding-top:15px;margin-top:20px}summary{cursor:pointer;font-weight:600;font-size:13px;min-height:32px}.footer{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:23px;margin-top:25px}.footer-right{display:flex;align-items:center;gap:14px}.primary,.secondary{border:0;border-radius:10px;padding:13px 21px;font-weight:600;min-height:46px}.primary{background:var(--green);color:#fff}.primary:hover{background:#194b3a}.primary:disabled{opacity:.45;cursor:default}.secondary{background:transparent;border:1px solid var(--line)}.error{color:#a33125;font-size:13px;margin:12px 0}.list-row{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding:13px 0}.list-row:last-child{border:0}.list-row p{margin:0;font-size:13px}.review-edit{color:var(--green);border:0;background:none;font-size:12px;align-self:start}.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.round{background:#eef2e8;border-radius:9px;padding:12px 8px;text-align:center;font-size:11px}.round b{display:block;font-size:18px}.match{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:20px 0}.team{background:#f4f6f0;padding:17px;border-radius:10px;font-size:12px}.team b{display:block;font-size:15px}.team.winner{border:1px solid #7c9f74}.player{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf0e9;font-size:12px}.player:last-child{border:0}.player span{color:var(--muted);width:58px;flex-shrink:0}.player b{font-weight:550;text-align:right}.success{background:var(--green);color:#fff;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;font-size:28px;margin-bottom:22px}.status-dot{display:inline-block;width:6px;height:6px;background:#7c9771;border-radius:50%;margin-right:6px}.tie-row{display:flex;gap:8px;align-items:center;margin:10px 0}.tie-row select{min-width:0}.icon-button{width:36px;min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;flex-shrink:0}.tie-empty{padding:16px;border:1px dashed #c7d2c0;border-radius:10px;color:var(--muted);font-size:13px}.draft-badge{font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(min-width:1550px){.main{padding-top:55px}.columns{gap:40px}}@media(max-width:1100px){.layout{grid-template-columns:185px minmax(0,1fr)}.rail{padding:30px 12px}.main{padding:32px 25px}.columns{grid-template-columns:minmax(0,1fr) 230px;gap:18px}.panel{padding:20px}}@media(max-width:850px){.top{height:64px;padding:0 20px}.layout{display:block;min-height:0}.rail{border-right:0;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;overflow-x:auto;gap:6px}.rail-label,.rail-note{display:none}.step{width:auto;white-space:nowrap;padding:8px;font-size:12px;margin:0;gap:7px}.step span{width:22px;height:22px}.main{padding:28px 20px}.columns{grid-template-columns:1fr}.summary{position:static}.summary .panel{margin-bottom:0}.summary-row{padding:7px 0}.summary-title{margin-bottom:8px}.intro{margin-bottom:22px}.footer{margin-top:20px}.draft-badge{display:none}.template{padding:25px}.names{grid-template-columns:1fr 1fr}}@media(max-width:420px){.top .small{max-width:110px;text-align:right}.panel{padding:18px}.main{padding:25px 16px}.facts{gap:8px}.facts span{font-size:11px}.footer .primary,.footer .secondary{padding:12px 16px}.mini-bracket{gap:5px}.mini-bracket b{padding:7px 10px}.rounds{gap:5px}.round{font-size:10px;padding:10px 3px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.summary-shell>summary{display:none}@media(max-width:850px){.summary-shell>summary{display:list-item;margin:0 0 12px;min-height:36px;padding:8px 0}.summary-shell{border-top:1px solid var(--line);padding-top:12px}}

.score-group{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin:0 0 16px}
.score-group>summary{display:flex;align-items:center;gap:12px;padding:3px 0;list-style:none}
.score-group>summary:before{content:'+';font-size:20px;color:var(--green);width:15px;flex-shrink:0}
.score-group[open]>summary:before{content:'−'}
.score-group>summary b{font-size:17px}.score-group>summary small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:4px}
.score-rule{padding:18px 0;border-top:1px solid var(--line);margin-top:12px}.score-rule-head{display:flex;justify-content:space-between;align-items:center;gap:15px;min-height:30px;cursor:pointer}.score-rule-head b{font-size:14px;font-weight:600}
.score-controls{margin-top:12px}.score-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.score-chip{border:1px solid var(--line);background:#fff;border-radius:24px;min-height:44px;padding:8px 17px;font-size:13px}.score-chip[aria-pressed=true]{background:#eaf2df;border-color:var(--green);color:var(--green);font-weight:700}
.score-number{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.score-number input{width:115px}.position-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.position-grid label{font-size:12px;color:var(--muted)}.position-grid input{margin-top:5px}

<body>
<div class="study">Interactive design study · Changes stay in this tab · No league is created</div>
<header class="top"><div class="brand"><span>h</span>howieszn</div><div class="small">Commissioner setup / Concept 01</div></header>
<div class="layout"><nav class="rail" aria-label="Setup steps"></nav><main class="main" id="main"><div class="eyebrow" id="eyebrow"></div><h1 id="heading" tabindex="-1"></h1><p class="intro" id="intro"></p><div class="columns"><section id="screen" aria-labelledby="heading"></section><aside class="summary" aria-label="League summary" id="summary"></aside></div><p class="error" id="error" role="alert" hidden></p><footer class="footer"><button class="secondary" id="back" type="button">Back</button><div class="footer-right"><span class="draft-badge"><span class="status-dot"></span>Preview only</span><button class="primary" id="next" type="button">Continue →</button></div></footer></main></div>
<script>
'use strict';
const steps=['Set Up','Rosters & Draft','Managers','Timing','Scoring & Ties','See a round','Review'];
const titles=['Give your league a starting point.','Decide who owns the roster.','Bring your people together.','Two locks. Two different decisions.','Make every point count.','See how a round plays out.','Your league, at a glance.'];
const intros=["Start with a default set of rules. Customize it however you'd like.",'Set ownership, bench allocation, and draft destination separately.','Up to 16 teams. 4 rounds. Your people.','Assign a player to a team. Then choose when they start.','Choose scoring and the criteria that decide a tied matchup.','A sample matchup, from first lineup to inherited roster.','Review the rules your members will see before joining.'];
const scoringPositions=['QB','RB','WR','TE','K','DEF'];
function editingPosition(){return state.customPositions?state.activePosition:'base';}
function statFor(id,scope=editingPosition()){return scope==='base'?state.stats[id]:(state.positionStats[scope][id]||state.stats[id]);}
function updateStat(id,changes){const scope=editingPosition();if(scope==='base')Object.assign(state.stats[id],changes);else state.positionStats[scope][id]={...statFor(id,scope),...changes};}
function positionScoringPanel(){const active=editingPosition(),count=scoringPositions.reduce((n,p)=>n+Object.keys(state.positionStats[p]).length,0);return panel('Position scoring',`<label class="row"><span>Customize Scoring by Position</span><input type="checkbox" id="customize-position-scoring" ${state.customPositions?'checked':''}></label>${state.customPositions?`<div class="score-position-tabs" role="group" aria-label="Scoring position">${['base',...scoringPositions].map(p=>`<button type="button" id="scope-${p}" class="score-chip" data-scoring-position="${p}" aria-pressed="${active===p}">${p==='base'?'Base rules':p}${p!=='base'&&Object.keys(state.positionStats[p]).length?` <span class="small">(${Object.keys(state.positionStats[p]).length})</span>`:''}</button>`).join('')}</div><p class="note">${active==='base'?'Base rules apply to every position unless overridden.':`${active} uses base rules until you change one. Overrides replace that rule’s base value.`} Reception bonuses below are additive.</p>`:`<p class="note">Base rules apply to all positions.${count?' Position overrides are preserved but do not apply while this is off.':''}</p>`}`);}
function inheritanceNote(r){const scope=editingPosition();if(scope==='base')return '';const own=Object.prototype.hasOwnProperty.call(state.positionStats[scope],r[0]);const base=state.stats[r[0]],label=base.enabled?ruleValue(r,base):'Off';return `<div class="inheritance-note"><span>${own?'Override':'Uses base'} · Base: ${esc(label)}</span>${own?`<button type="button" class="quiet-button" data-stat-reset="${r[0]}" aria-label="Use base rule for ${r[1]}">Use base rule</button>`:''}</div>`;}
function bindPositionScoring(){const toggle=$('#customize-position-scoring');if(toggle)toggle.onchange=()=>{state.customPositions=toggle.checked;redrawScores('customize-position-scoring');};document.querySelectorAll('[data-scoring-position]').forEach(e=>e.onclick=()=>{state.activePosition=e.dataset.scoringPosition;redrawScores(e.id);});document.querySelectorAll('[data-stat-reset]').forEach(e=>e.onclick=()=>{delete state.positionStats[editingPosition()][e.dataset.statReset];redrawScores(`stat-${e.dataset.statReset}`);});}
function scoringReview(){const posSections=state.customPositions?scoringPositions.filter(pos=>Object.keys(state.positionStats[pos]).length).map(pos=>`<details><summary>${pos} · ${Object.keys(state.positionStats[pos]).length} position overrides</summary>${Object.entries(state.positionStats[pos]).map(([id,value])=>`<div class="summary-row"><span>${ruleById[id][1]}</span><b>${value.enabled?esc(ruleValue(ruleById[id],value)):'Off'}</b></div>`).join('')}</details>`).join(''):'';return `<div class="panel"><h2>Scoring rules</h2><p class="note">Fractional yardage ${state.fractional?'on':'off'} · Negative values ${state.negative?'allowed':'not allowed'} · Position overrides ${state.customPositions?'on':'off'}</p><h3>Base rules</h3>${scoringGroups.map(g=>`<details><summary>${g.name} · ${g.rules.filter(r=>state.stats[r[0]].enabled).length} enabled</summary>${g.rules.filter(r=>state.stats[r[0]].enabled).map(r=>`<div class="summary-row"><span>${r[1]}</span><b>${esc(ruleValue(r,state.stats[r[0]]))}</b></div>`).join('')}</details>`).join('')}${posSections?`<h3 style="margin-top:20px">Position-specific overrides</h3>${posSections}`:''}${state.positionBonuses?`<h3 style="margin-top:20px">Additional reception bonuses</h3>${Object.entries(state.positionBonus).map(([pos,v])=>`<div class="summary-row"><span>${pos}</span><b>${v} additional points per reception</b></div>`).join('')}<p class="note">${premiumExample()}</p>`:''}<button class="quiet-button" type="button" data-edit="4">Edit scoring</button></div>`;}

const scoringGroups=[
  {id:'passing',name:'Passing',rules:[
    ['passTD','Passing touchdowns',4,true,[4,6]],['interceptions','Interceptions thrown',-2,true,[-1,-2]],['passYards','Passing yards',25,true,[25],'yards'],
    ['passAttempts','Passing attempts',0.1,false],['completions','Completions',0.1,false],['incompletions','Incomplete passes',-0.1,false],['sacksTaken','Sacks taken',-1,false],['pickSix','Pick sixes thrown',-2,false],['longCompletion','40+ yard completions',0.5,false],['longPassTD','40+ yard passing touchdowns',1,false],['passFirst','Passing first downs',0.25,false]
  ]},
  {id:'rushing',name:'Rushing',rules:[['rushTD','Rushing touchdowns',6,true,[6]],['rushYards','Rushing yards',10,true,[10],'yards'],['rushAttempts','Rushing attempts',0.1,false],['longRun','40+ yard runs',1,false],['longRushTD','40+ yard rushing touchdowns',1.5,false],['rushFirst','Rushing first downs',0.25,false]]},
  {id:'receiving',name:'Receiving',rules:[['receptions','Receptions',0.5,true,[0,0.5,1]],['receiveTD','Receiving touchdowns',6,true,[6]],['receiveYards','Receiving yards',10,true,[10],'yards'],['longCatch','40+ yard receptions',1,false],['longReceiveTD','40+ yard receiving touchdowns',1.5,false],['receiveFirst','Receiving first downs',0.25,false]]},
  {id:'kicking',name:'Kicking',rules:[['pat','Extra points made',1,true,[1]],['patMiss','Extra points missed',-1,true,[-1]],['fg019','Field goals · 0–19 yards',3,true,[3]],['fg2029','Field goals · 20–29 yards',3,true,[3]],['fg3039','Field goals · 30–39 yards',3,true,[3]],['fg4049','Field goals · 40–49 yards',4,true,[4]],['fg50','Field goals · 50+ yards',5,true,[5]],['fgMiss','Field goals missed',-1,false,[-1]]]},
  {id:'defense',name:'Team Defense',rules:[['defSack','Sacks',1,true,[1]],['defINT','Interceptions',2,true,[2]],['defFumble','Fumble recoveries',2,true,[2]],['defTD','Defensive touchdowns',6,true,[6]],['defSafety','Safeties',2,true,[2]],['defBlock','Blocked kicks',2,true,[2]],['defReturn','Kick/punt return touchdowns',6,false,[6]],['pa0','Points allowed · 0',10,true,[10]],['pa16','Points allowed · 1–6',7,true,[7]],['pa713','Points allowed · 7–13',4,true,[4]],['pa1420','Points allowed · 14–20',1,true,[1]],['pa2127','Points allowed · 21–27',0,true,[0]],['pa2834','Points allowed · 28–34',-1,true,[-1]],['pa35','Points allowed · 35+',-4,true,[-4]]]},
  {id:'misc',name:'Miscellaneous',rules:[['fumbles','Fumbles lost',-2,true,[-1,-2]],['twoPoint','Two-point conversions',2,true,[2]],['offFumbleTD','Offensive fumble return touchdowns',6,false,[6]]]}
,
  {id:'outcomes',name:'Team results',rules:[['teamWin','NFL team wins',5,false,[1,3,5]]]}
];
function defaultStats(){return Object.fromEntries(scoringGroups.flatMap(g=>g.rules.map(r=>[r[0],{enabled:r[3],value:r[2],custom:false}])));}
const ruleById=Object.fromEntries(scoringGroups.flatMap(g=>g.rules.map(r=>[r[0],r])));
function ruleValue(r,setting=statFor(r[0])){const v=setting.value;if(v===null)return 'Needs a value';return r[5]==='yards'?`1 point per ${v} yards`:`${v} ${Math.abs(v)===1?'point':'points'}`;}
function groupSummary(g){const active=g.rules.filter(r=>statFor(r[0]).enabled);return `${active.length} enabled${active.length?' · '+active.slice(0,2).map(r=>`${r[1]} ${ruleValue(r)}`).join(' · '):''}`;}
function scoringRow(r){const [id,label,, ,presets=[],kind='points']=r,setting=statFor(id);return `<div class="score-rule" id="rule-${id}"><label class="score-rule-head" for="stat-${id}"><b>${label}</b><input type="checkbox" role="switch" id="stat-${id}" data-stat-toggle="${id}" ${setting.enabled?'checked':''}></label>${inheritanceNote(r)}${id==='teamWin'?'<p class="note">A win by the associated NFL team. Participation eligibility and finalization remain to be defined.</p>':''}${setting.enabled?`<div class="score-controls">${presets.length?`<div class="score-presets" role="group" aria-label="${label} presets">${presets.map(v=>`<button type="button" class="score-chip" id="preset-${id}-${v}" data-stat-preset="${id}" data-value="${v}" aria-pressed="${!setting.custom&&setting.value===v}">${v} ${kind==='yards'?'yards':Math.abs(v)===1?'point':'points'}</button>`).join('')}<button type="button" class="score-chip" id="custom-${id}" data-stat-custom="${id}" aria-pressed="${setting.custom}">Custom</button></div>`:''}${!presets.length||setting.custom?`<label class="score-number"><input type="number" id="value-${id}" data-stat-value="${id}" aria-label="${label} ${kind==='yards'?'yards per point':'points'}" step="any" ${kind==='yards'?'min="0.01"':''} value="${setting.value===null?'':setting.value}"><span>${kind==='yards'?'yards = 1 point':'points'}</span></label>`:kind==='yards'?'<div class="small">= 1 point</div>':''}</div>`:`<div class="small">Off · configured value ${ruleValue(r)}</div>`}</div>`;}
